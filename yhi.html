<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<meta content="#000000" name="theme-color"/>
<title>Ani Emo Eye — Interactive Animations &amp; Motion</title>
<style>
:root{color-scheme:dark;--bg:#000;--eye:#f4f7ff;--accent:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none}
#screen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ambient-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%, rgba(56,189,248,0.06) 0%, rgba(0,0,0,0) 65%);transition:background 0.8s ease}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:2.5px;color:#555d6e;pointer-events:none;transition:opacity .4s ease;font-weight:600}
#motion-badge{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:14px;padding:5px 10px;border-radius:20px;background:rgba(18,20,26,0.85);border:1px solid #232733;font-size:10px;letter-spacing:1px;color:#7e8698;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px);cursor:pointer;z-index:20}
#motion-badge .dot{width:6px;height:6px;border-radius:50%;background:#ef4444;transition:background .3s}
#motion-badge.active .dot{background:#22c55e;box-shadow:0 0 8px #22c55e}
#motion-badge.active{color:#c9d1e3;border-color:#38bdf844}
#menu{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:38px;height:38px;border:1px solid #242834;background:rgba(14,16,22,0.85);backdrop-filter:blur(10px);border-radius:50%;color:#9aa3b6;font-size:18px;display:grid;place-items:center;cursor:pointer;z-index:25;transition:transform .2s,border-color .2s}
#menu:active{transform:scale(0.92);border-color:#38bdf8}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 36px);max-height:80vh;overflow-y:auto;padding:16px;background:rgba(13,15,20,0.96);backdrop-filter:blur(24px);border:1px solid #252a38;border-radius:22px;display:none;box-shadow:0 16px 48px rgba(0,0,0,0.9);z-index:30}
#panel.open{display:block;animation:pop .24s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.section-title{font-size:10px;letter-spacing:2px;color:#737b8d;margin:12px 0 8px;font-weight:700}
.section-title:first-child{margin-top:0}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.moods button{border:1px solid #272d3b;background:#0d1017;color:#cdd4e3;border-radius:12px;padding:10px 2px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .15s ease}
.moods button .icon{font-size:14px}
.moods button:active,.moods button.active{background:#1e2536;border-color:#38bdf8;color:#fff;box-shadow:0 0 12px rgba(56,189,248,0.2)}
.effects{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.effects button{border:1px solid #272d3b;background:#0d1017;color:#cdd4e3;border-radius:12px;padding:9px 4px;font-size:11px;cursor:pointer;transition:all .15s}
.effects button.active{background:#1e2536;border-color:#a855f7;color:#fff}
.utilities{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.utility{border:1px solid #272d3b;background:#10131b;color:#d8dbe2;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.utility.active{background:#0e2938;border-color:#38bdf8;color:#38bdf8}
#status{font-size:10px;color:#676f82;margin-top:12px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div aria-label="Animated Emo Robot Eyes with Motion Sensors" id="screen">
<div id="ambient-glow"></div>
<canvas id="face"></canvas>
<div id="motion-badge"><span class="dot"></span><span id="motion-badge-text">SENSOR: OFF</span></div>
<div id="hint">TAP TO CHANGE EXPRESSION</div>
<button aria-label="Open settings and moods" id="menu">⋯</button>
<div id="panel">
<div class="section-title">EMOTIONS &amp; MOODS (12 MODES)</div>
<div class="moods" id="mood-grid">
<button class="active" data-mood="neutral"><span class="icon">👀</span>Neutral</button>
<button data-mood="happy"><span class="icon">😄</span>Happy</button>
<button data-mood="love"><span class="icon">💖</span>Love</button>
<button data-mood="sleep"><span class="icon">😴</span>Sleep</button>
<button data-mood="angry"><span class="icon">😡</span>Angry</button>
<button data-mood="sad"><span class="icon">🥺</span>Sad</button>
<button data-mood="surprised"><span class="icon">😲</span>Wow</button>
<button data-mood="doubt"><span class="icon">🤨</span>Doubt</button>
<button data-mood="wink"><span class="icon">😉</span>Wink</button>
<button data-mood="dizzy"><span class="icon">😵‍💫</span>Dizzy</button>
<button data-mood="matrix"><span class="icon">⚡</span>Cyborg</button>
<button data-mood="hypno"><span class="icon">🌀</span>Hypno</button>
</div>
<div class="section-title">VISUAL FX &amp; PARTICLES</div>
<div class="effects">
<button id="fx-sparkles">✨ Sparkles</button>
<button id="fx-tears">💧 Tears</button>
<button id="fx-steam">💨 Angry Steam</button>
</div>
<div class="section-title">CONTROLS &amp; SENSORS</div>
<div class="utilities">
<button class="utility" id="motion-toggle">Gyro Sensor: Off</button>
<button class="utility" id="sound-toggle">Audio: Off</button>
<button class="utility" id="color-toggle">Color: Ice Cyan</button>
</div>
<div id="status">Tilt phone to steer gaze • Tap canvas to cycle expression</div>
</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('face'), ctx=canvas.getContext('2d');
const screen=document.getElementById('screen'), panel=document.getElementById('panel'), hint=document.getElementById('hint');
const glow=document.getElementById('ambient-glow'), badge=document.getElementById('motion-badge'), badgeText=document.getElementById('motion-badge-text');

let W=0, H=0, dpr=1;
let mood='neutral', lookX=0, lookY=0, targetX=0, targetY=0;
let blink=0, nextBlink=performance.now()+2200;
let motionOn=false, soundOn=false, audio=null;
let dizzyAngle=0, hypnoRadius=0, cycle=0;

// Particle System for Effects
let particles=[];
let activeFX={sparkles:false, tears:false, steam:false};

const moods=['neutral','happy','love','sleep','angry','sad','surprised','doubt','wink','dizzy','matrix','hypno'];
const colorThemes=[
  {name:'Ice Cyan', eye:'#f0f8ff', pupil:'#020617', glow:'rgba(56,189,248,0.18)'},
  {name:'Neon Gold', eye:'#fff8db', pupil:'#1a1001', glow:'rgba(245,158,11,0.22)'},
  {name:'Emerald', eye:'#ebfef4', pupil:'#022011', glow:'rgba(16,185,129,0.20)'},
  {name:'Vamp Red', eye:'#ffebeb', pupil:'#1f0505', glow:'rgba(239,68,68,0.22)'},
  {name:'Cyber Purple', eye:'#f8efff', pupil:'#13031f', glow:'rgba(168,85,247,0.22)'}
];
let currentThemeIdx=0;

function resize(){
  W=window.innerWidth||document.documentElement.clientWidth||screen.clientWidth||800;
  H=window.innerHeight||document.documentElement.clientHeight||screen.clientHeight||600;
  dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize,{passive:true});
window.visualViewport?.addEventListener('resize',resize,{passive:true});
resize();

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){
    ctx.roundRect(x,y,w,h,Math.min(r, w/2, h/2));
  } else {
    r=Math.min(r, w/2, h/2);
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  ctx.fill();
}

function drawHeart(cx,cy,s,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(cx,cy+s*.42);
  ctx.bezierCurveTo(cx-s*1.2,cy-s*.2,cx-s*.8,cy-s*.85,cx,cy-s*.35);
  ctx.bezierCurveTo(cx+s*.8,cy-s*.85,cx+s*1.2,cy-s*.2,cx,cy+s*.42);
  ctx.fill();
}

function spawnParticles(type, x, y, count=1){
  for(let i=0;i<count;i++){
    if(type==='sparkle'){
      particles.push({
        x: x+(Math.random()-0.5)*W*0.6,
        y: y+(Math.random()-0.5)*H*0.4,
        vx:(Math.random()-0.5)*1.2,
        vy:(Math.random()-0.5)*1.2,
        life:1, decay:0.015+Math.random()*0.02,
        size:2+Math.random()*3.5,
        color:'#38bdf8'
      });
    } else if(type==='tear'){
      particles.push({
        x: x+(Math.random()-0.5)*10,
        y: y,
        vx:(Math.random()-0.5)*0.4,
        vy:1.8+Math.random()*2.2,
        life:1, decay:0.02,
        size:3.5+Math.random()*3,
        color:'#60a5fa'
      });
    } else if(type==='steam'){
      particles.push({
        x: x+(Math.random()-0.5)*20,
        y: y,
        vx:(Math.random()-0.5)*1.4,
        vy:-1.6-Math.random()*2,
        life:1, decay:0.025,
        size:4+Math.random()*6,
        color:'rgba(255,100,100,0.8)'
      });
    }
  }
}

function updateAndDrawParticles(){
  for(let i=particles.length-1; i>=0; i--){
    let p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawEye(x,y,w,h,side,t){
  let m=mood, sy=1, tilt=0, pupilY=0, pupilX=lookX*w*.14;
  let isWinkRight=(m==='wink'&&side===1);

  if(m==='happy'){ sy=.64; tilt=side===0?-.12:.12; }
  else if(m==='sleep'||isWinkRight){ sy=.12; }
  else if(m==='angry'){ sy=.76; tilt=side===0?.22:-.22; pupilY=-h*.03; }
  else if(m==='sad'){ sy=.82; tilt=side===0?.16:-.16; pupilY=h*.06; }
  else if(m==='surprised'){ sy=1.16; }
  else if(m==='doubt'){ sy=.86; tilt=side===0?-.10:.14; pupilX+=side===0?-w*.04:w*.04; }
  else if(m==='love'){ sy=.94; }
  else if(m==='dizzy'){ sy=1.0; }
  else if(m==='matrix'){ sy=.95; }
  else if(m==='hypno'){ sy=1.05; }

  // Blink logic
  if(m!=='sleep'&&!isWinkRight){
    sy*=Math.max(.04, 1-blink);
  }

  let eh=h*sy, ey=y+(h-eh)/2+lookY*h*.06+pupilY;
  const theme=colorThemes[currentThemeIdx];

  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  ctx.rotate(tilt);
  ctx.translate(-(x+w/2), -(y+h/2));

  // Outer Eye Body
  ctx.shadowColor=theme.glow;
  ctx.shadowBlur=18;
  ctx.fillStyle=theme.eye;

  if(m==='love'){
    ctx.shadowBlur=24;
    drawHeart(x+w*.5, y+h*.5, Math.min(w,h)*.45, theme.eye);
  } else if(m==='sleep'||isWinkRight){
    roundedRect(x, y+h*.44, w, h*.13, h*.065);
    ctx.fillStyle='#000';
    ctx.fillRect(x+w*.1, y+h*.48, w*.8, h*.04);
  } else {
    let rr=Math.min(w,eh)*.32;
    roundedRect(x, ey, w, eh, rr);

    // Inner eye content / pupil
    if(blink<0.75){
      ctx.shadowBlur=0;
      let pr=Math.min(w,eh)*(m==='surprised'?0.25:0.20);
      let px=x+w/2+pupilX, py=ey+eh*.52+lookY*eh*.09;

      if(m==='happy'){
        ctx.fillStyle=theme.pupil;
        ctx.beginPath();
        ctx.ellipse(x+w/2, ey+eh*.54, w*.18, eh*.13, 0, 0, Math.PI*2);
        ctx.fill();
      } else if(m==='dizzy'){
        // Dizzy spiral
        ctx.strokeStyle=theme.pupil;
        ctx.lineWidth=Math.max(2.5, w*0.04);
        ctx.beginPath();
        for(let a=0; a<Math.PI*5; a+=0.15){
          let r=a*(pr/12);
          let sx=px+Math.cos(a+dizzyAngle*(side===0?1:-1))*r;
          let sy2=py+Math.sin(a+dizzyAngle*(side===0?1:-1))*r;
          if(a===0) ctx.moveTo(sx,sy2); else ctx.lineTo(sx,sy2);
        }
        ctx.stroke();
      } else if(m==='hypno'){
        // Concentric rings
        ctx.strokeStyle=theme.pupil;
        ctx.lineWidth=Math.max(2, w*0.035);
        for(let r=4; r<pr*1.4; r+=7){
          let waveR=(r+hypnoRadius)% (pr*1.4);
          ctx.beginPath();
          ctx.arc(px, py, waveR, 0, Math.PI*2);
          ctx.stroke();
        }
      } else if(m==='matrix'){
        // Digital cyborg crosshair
        ctx.fillStyle=theme.pupil;
        ctx.fillRect(px-pr, py-pr*.3, pr*2, pr*.6);
        ctx.fillRect(px-pr*.3, py-pr, pr*.6, pr*2);
        ctx.fillStyle='#00ffcc';
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI*2);
        ctx.fill();
      } else {
        // Standard expressive pupil with catchlight
        ctx.fillStyle=theme.pupil;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI*2);
        ctx.fill();

        // Eye reflections
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(px-pr*.32, py-pr*.35, Math.max(1.8, pr*.26), 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px+pr*.32, py+pr*.28, Math.max(1.2, pr*.14), 0, Math.PI*2);
        ctx.fill();
      }

      // Eyebrow overlays for expressiveness
      if(m==='angry'||m==='sad'||m==='doubt'){
        ctx.strokeStyle=theme.eye;
        ctx.lineWidth=Math.max(3.5, w*.05);
        ctx.lineCap='round';
        ctx.beginPath();
        if(m==='angry'){
          ctx.moveTo(x+w*.06, y+h*(side===0?0.08:0.26));
          ctx.lineTo(x+w*.94, y+h*(side===0?0.26:0.08));
        } else if(m==='sad'){
          ctx.moveTo(x+w*.08, y+h*.22);
          ctx.quadraticCurveTo(x+w*.5, y-h*.06, x+w*.92, y+h*.14);
        } else {
          ctx.moveTo(x+w*.12, y+h*.08);
          ctx.quadraticCurveTo(x+w*.5, y-h*.02, x+w*.88, y+h*.09);
        }
        ctx.stroke();
      }
    }
  }

  ctx.restore();

  // FX emitters tied to eyes
  if(activeFX.tears || m==='sad'){
    if(Math.random()<0.3) spawnParticles('tear', x+w*0.5, y+h*0.8, 1);
  }
  if(activeFX.steam || m==='angry'){
    if(Math.random()<0.25) spawnParticles('steam', x+w*(side===0?0.2:0.8), y+h*0.1, 1);
  }
}

function drawMouth(cx,cy,scale){
  if(['neutral','sleep'].includes(mood)) return;
  const theme=colorThemes[currentThemeIdx];
  ctx.save();
  ctx.strokeStyle=theme.eye;
  ctx.fillStyle=theme.eye;
  ctx.lineWidth=Math.max(2.5, W*.006);
  ctx.lineCap='round';

  if(mood==='happy'||mood==='wink'){
    ctx.beginPath();
    ctx.arc(cx, cy, scale*.36, 0.15*Math.PI, .85*Math.PI);
    ctx.stroke();
  } else if(mood==='sad'){
    ctx.beginPath();
    ctx.arc(cx, cy+scale*.24, scale*.34, 1.15*Math.PI, 1.85*Math.PI);
    ctx.stroke();
  } else if(mood==='angry'){
    ctx.beginPath();
    ctx.moveTo(cx-scale*.32, cy+scale*.05);
    ctx.lineTo(cx+scale*.32, cy-scale*.05);
    ctx.stroke();
  } else if(mood==='surprised'){
    ctx.beginPath();
    ctx.ellipse(cx, cy, scale*.15, scale*.24, 0, 0, Math.PI*2);
    ctx.fill();
  } else if(mood==='doubt'){
    ctx.beginPath();
    ctx.moveTo(cx-scale*.24, cy);
    ctx.quadraticCurveTo(cx, cy+scale*.08, cx+scale*.26, cy-scale*.04);
    ctx.stroke();
  } else if(mood==='love'){
    ctx.beginPath();
    ctx.arc(cx, cy, scale*.2, 0, Math.PI*2);
    ctx.stroke();
  } else if(mood==='dizzy'){
    ctx.beginPath();
    ctx.moveTo(cx-scale*.28, cy);
    ctx.bezierCurveTo(cx-scale*.1, cy+scale*.15, cx+scale*.1, cy-scale*.15, cx+scale*.28, cy);
    ctx.stroke();
  } else if(mood==='matrix'){
    ctx.beginPath();
    ctx.moveTo(cx-scale*.25, cy);
    ctx.lineTo(cx-scale*.08, cy+scale*.08);
    ctx.lineTo(cx+scale*.08, cy-scale*.08);
    ctx.lineTo(cx+scale*.25, cy);
    ctx.stroke();
  }
  ctx.restore();
}

function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  // Smooth interpolation for look gaze
  lookX+=(targetX-lookX)*0.08;
  lookY+=(targetY-lookY)*0.08;
  dizzyAngle+=0.06;
  hypnoRadius=(hypnoRadius+0.35)%14;

  if(t>nextBlink && mood!=='sleep'){
    blink=Math.min(1, blink+0.22);
    if(blink>=1){ blink=0; nextBlink=t+1800+Math.random()*2800; }
  } else if(blink>0){
    blink=Math.max(0, blink-0.28);
  }

  // Active Sparkles FX
  if(activeFX.sparkles || mood==='love' || mood==='hypno'){
    if(Math.random()<0.35) spawnParticles('sparkle', W/2, H*0.44, 1);
  }

  // Eye calculation: 2 eyes side-by-side, fully responsive & centered on screen
  const eyeW = Math.min(W * 0.28, H * 0.22, 140);
  const eyeH = eyeW * 1.05;
  const gap = eyeW * 0.26;
  const totalW = eyeW * 2 + gap;
  const startX = (W - totalW) / 2;
  const startY = (H * 0.44) - (eyeH / 2);

  // Draw Left Eye (side 0) & Right Eye (side 1)
  drawEye(startX, startY, eyeW, eyeH, 0, t);
  drawEye(startX + eyeW + gap, startY, eyeW, eyeH, 1, t);

  // Draw expressive robot mouth underneath
  drawMouth(W / 2, startY + eyeH + Math.min(H * 0.08, eyeW * 0.45), eyeW * 0.48);

  updateAndDrawParticles();

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Audio synth
function beep(freq, type='sine'){
  if(!soundOn) return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
    let o=audio.createOscillator(), g=audio.createGain();
    o.type=type;
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.04, audio.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+0.2);
    o.connect(g);
    g.connect(audio.destination);
    o.start();
    o.stop(audio.currentTime+0.21);
  }catch(e){}
}

function setMood(m){
  mood=m;
  hint.style.opacity='0.15';
  document.querySelectorAll('#mood-grid button').forEach(b=>{
    b.classList.toggle('active', b.dataset.mood===m);
  });
  const theme=colorThemes[currentThemeIdx];
  glow.style.background=`radial-gradient(circle at 50% 44%, ${theme.glow} 0%, rgba(0,0,0,0) 65%)`;

  let freqs={neutral:400, happy:680, love:560, sleep:220, angry:180, sad:240, surprised:720, doubt:340, wink:590, dizzy:460, matrix:880, hypno:510};
  beep(freqs[m]||440);
}

document.querySelectorAll('[data-mood]').forEach(b=>{
  b.addEventListener('click',()=>setMood(b.dataset.mood));
});

// Top menu toggle
document.getElementById('menu').onclick=()=>panel.classList.toggle('open');

// Tap screen to switch expressions
screen.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('#panel')||e.target.closest('#motion-badge')) return;
  if(panel.classList.contains('open')){ panel.classList.remove('open'); return; }
  cycle=(cycle+1)%moods.length;
  setMood(moods[cycle]);
});

// FX buttons
['sparkles','tears','steam'].forEach(fx=>{
  const btn=document.getElementById('fx-'+fx);
  btn.onclick=()=>{
    activeFX[fx]=!activeFX[fx];
    btn.classList.toggle('active', activeFX[fx]);
  };
});

// Motion Sensor (Gyroscope + Accelerometer)
const motionToggle=document.getElementById('motion-toggle');

async function enableMotionSensors(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      let permission=await DeviceOrientationEvent.requestPermission();
      if(permission!=='granted') throw new Error('Permission denied');
    }
    motionOn=true;
    window.addEventListener('deviceorientation', handleOrientation, true);
    window.addEventListener('devicemotion', handleMotion, true);
    motionToggle.textContent='Gyro Sensor: On';
    motionToggle.classList.add('active');
    badge.classList.add('active');
    badgeText.textContent='GYRO SENSOR: ACTIVE';
    document.getElementById('status').textContent='Sensor active! Tilt and shake phone to control eyes';
    beep(800);
  }catch(err){
    motionOn=false;
    badge.classList.remove('active');
    badgeText.textContent='SENSOR: UNAVAILABLE';
    motionToggle.textContent='Gyro Sensor: Error';
    document.getElementById('status').textContent='Motion sensor access not allowed on this browser/environment';
  }
}

function disableMotionSensors(){
  motionOn=false;
  window.removeEventListener('deviceorientation', handleOrientation);
  window.removeEventListener('devicemotion', handleMotion);
  motionToggle.textContent='Gyro Sensor: Off';
  motionToggle.classList.remove('active');
  badge.classList.remove('active');
  badgeText.textContent='SENSOR: OFF';
}

function handleOrientation(e){
  if(!motionOn) return;
  // Gamma is left/right tilt [-90,90], Beta is front/back tilt [-180,180]
  let gamma=e.gamma||0;
  let beta=e.beta||0;
  targetX=Math.max(-1, Math.min(1, gamma/30));
  targetY=Math.max(-1, Math.min(1, (beta-35)/35));
}

// Shake detection from accelerometer
let lastShake=0;
function handleMotion(e){
  if(!motionOn) return;
  let acc=e.accelerationIncludingGravity;
  if(!acc) return;
  let speed=Math.abs(acc.x||0)+Math.abs(acc.y||0)+Math.abs(acc.z||0);
  if(speed>24 && performance.now()-lastShake>900){
    lastShake=performance.now();
    // Shake causes surprised or dizzy
    setMood(mood==='dizzy'?'surprised':'dizzy');
    beep(950);
  }
}

motionToggle.onclick=()=>{
  if(!motionOn) enableMotionSensors(); else disableMotionSensors();
};
badge.onclick=motionToggle.onclick;

// Audio toggle
const soundToggle=document.getElementById('sound-toggle');
soundToggle.onclick=()=>{
  soundOn=!soundOn;
  soundToggle.textContent='Audio: '+(soundOn?'On':'Off');
  soundToggle.classList.toggle('active', soundOn);
  if(soundOn) beep(600);
};

// Color theme toggle
const colorToggle=document.getElementById('color-toggle');
colorToggle.onclick=()=>{
  currentThemeIdx=(currentThemeIdx+1)%colorThemes.length;
  const th=colorThemes[currentThemeIdx];
  colorToggle.textContent='Color: '+th.name;
  glow.style.background=`radial-gradient(circle at 50% 44%, ${th.glow} 0%, rgba(0,0,0,0) 65%)`;
  beep(520);
};

// Touch drag looking fallback
let touchStartX=0, touchStartY=0;
screen.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});

screen.addEventListener('touchmove',e=>{
  let dx=e.touches[0].clientX-touchStartX;
  let dy=e.touches[0].clientY-touchStartY;
  targetX=Math.max(-1, Math.min(1, dx/80));
  targetY=Math.max(-1, Math.min(1, dy/80));
},{passive:true});

screen.addEventListener('touchend',()=>{
  setTimeout(()=>{ if(!motionOn){ targetX=0; targetY=0; } }, 1200);
},{passive:true});

// Mouse tracking
addEventListener('mousemove',e=>{
  if(motionOn) return;
  targetX=Math.max(-1, Math.min(1, (e.clientX/W - 0.5)*2.2));
  targetY=Math.max(-1, Math.min(1, (e.clientY/H - 0.5)*2.2));
});
})();
</script>
