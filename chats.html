<style>

.nm{font-weight:500;display:block}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}.av.photo{display:block;border:1px solid var(--ln)}
.row{touch-action:pan-y}.cmp .tl{gap:7px}.cmp #inp{flex:1;min-width:0;width:auto}.cmp #snd{margin-left:0;width:34px;height:36px}.cmp .tl{flex-wrap:nowrap}.cmp .tl #inp{padding:7px 2px;min-height:38px}.cmp .tl #smi,.cmp .tl [data-ins],.cmp #pan{display:none!important}.cmp #peerTag{display:none!important}.cmp{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}.cmp .tl .ib{width:34px;height:36px}

.btn{padding:6px 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--bl);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.93)}.btn.gh{background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.more{color:var(--bl);font-size:14px;padding:6px 0}
.cm{display:flex;align-items:center;gap:12px;padding:14px 0 6px;color:var(--mu)}
.room{display:flex;align-items:center;gap:8px;margin:0 -16px;padding:9px 16px 9px 20px;width:calc(100% + 32px);font-size:16px;font-weight:500;text-align:left;transition:background .25s,color .25s}
.room:active{background:var(--bg)}
.room.sel{background:var(--bl);color:#fff}.room.lk{color:var(--mu)}.room.sel.lk{color:#fff}
.room svg{opacity:.7;font-size:14px}.room .badge{margin-left:auto}
.rec{color:var(--mu);font-size:14px;padding:2px 0 8px}
.emp{text-align:center;color:var(--mu);padding:40px 12px;line-height:1.5}
.hl{color:var(--bl);font-weight:700}

.scrim{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--p);border-radius:18px 18px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,.8,.3,1);z-index:6}

.grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}

#boot{display:none!important}
#auth{position:absolute;inset:0;z-index:20;background:var(--p);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px 28px;transition:opacity .35s,transform .35s;opacity:0;pointer-events:none;transform:translateY(16px)}

.er{color:#d93a2b;font-size:14px;min-height:0}.ok{color:var(--ok);font-size:14px}
.big{height:46px;border-radius:23px;font-size:16px}.big:disabled{opacity:.5}
.lnk{color:var(--bl);font-size:14px;padding:6px}

.opt[hidden],.lnk[hidden]{display:none}
.hr{display:flex;align-items:center;gap:6px}.hr .sb{flex:1}

.cmp{padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));background:var(--hd)}

.sheet{padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--ln);border-bottom:0;box-shadow:0 -12px 40px #0002;max-height:82%;overflow-y:auto}
.sheet .grab{margin-bottom:16px}
.sheet h3{font-size:21px;font-weight:700;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.sheet .opt{min-height:48px;padding:13px 2px;border-bottom:1px solid var(--ln);font-size:15px;gap:14px}
.sheet .opt:last-of-type{margin-bottom:4px}
#blockedList{padding:4px 0 10px}
.blocked-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.blocked-entry button{color:var(--bl);font-weight:600;padding:8px 10px;border-radius:8px;background:var(--bg)}

</style></head>

async function submit(){

 if(!email||!pw){er.textContent='Enter a valid email and password.';return}
 if(pw.length<6){er.textContent='Password must be at least 6 characters.';return}
 const b=$('asub');b.disabled=true;
 try{
  if(signup){
   const cand=(email.split('@')[0].replace(/[^a-zA-Z0-9_]/g,'_').slice(0,15)||'operator').toLowerCase();let h=cand;
   for(let i=0;i<5;i++){if(!(await getDoc(doc(db,'usernames',h))).exists())break;h=cand+'_'+Math.floor(Math.random()*99)}

   await setDoc(doc(db,'usernames',h),{uid:c.user.uid});
   try{await sendEmailVerification(c.user)}catch(x){console.error(x)}
   inf.textContent='Verification email sent. Check your inbox (and spam).';await signOut(auth);
  }else{
   const c=await signInWithEmailAndPassword(auth,email,pw);
   if(!c.user.emailVerified){er.textContent='Please verify your email first. Check your inbox.';$('rsd').hidden=false;await signOut(auth)}
  }
 }catch(e){console.error(e);const k=e.code;er.textContent=k==='auth/email-already-in-use'?'This email is already registered. Try signing in.':k==='auth/invalid-email'?'Invalid email address.':k==='auth/weak-password'?'Password too weak. Use 6+ characters.':/user-not-found|wrong-password|invalid-credential/.test(k)?'Invalid email or password.':'Something went wrong. Try again.'}
 finally{b.disabled=false}
}

$('q').oninput=()=>{clearTimeout(sd);const v=$('q').value.trim();sr.q=v.toLowerCase().replace(/^(@|u\/)/,'');paintSearch();if(sr.q.length>=2){sr.busy=true;paintSearch();sd=setTimeout(()=>doSearch(sr.q),350)}};
async function doSearch(q){
 const out=new Map();
 try{const ud=await getDoc(doc(db,'usernames',q));if(ud.exists()){const u=await getDoc(doc(db,'users',ud.data().uid));if(u.exists())out.set(u.id,u.data())}}catch(e){console.error(e)}
 try{const s=await getDocs(query(collection(db,'users'),where('username','>=',q),where('username','<=',q+'\uf8ff'),limit(15)));s.forEach(d=>out.set(d.id,d.data()))}catch(e){console.error(e)}
 if(sr.q!==q)return;out.delete(ME.uid);sr.res=[...out];sr.busy=false;paintSearch();
}
function paintSearch(){

 if(q===(P?.username||'').toLowerCase()){s.innerHTML='<p class="emp">That’s you. Search for someone else.</p>';return}

function fmt(raw){
 let t=esc(raw);
 t=t.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,(m,l,c)=>`<pre>${c.trim()}</pre>`).replace(/`([^`]+)`/g,'<code>$1</code>');
 return t.replace(/\n/g,'<br>');
}

async function send(){
 const i=$('inp'),text=i.value.trim();if(!text||!ME||!cid||!peer)return;if(peer.uid!==YB&&(P?.blockedUids||[]).includes(peer.uid))return toast('Unblock this user before sending messages');

   try{let reply='…';
    try{const r=await fetch('/api/yuki',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:hist})});
     if(r.ok){const d=await r.json();reply=d.reply||d.response||d.message||d.text||d.result||'…';if(typeof reply!=='string')reply=JSON.stringify(reply)}else reply='Yuki is unreachable right now. Try again.'}

   }catch(e){console.error(e)}

  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data});
  const c=document.createElement('canvas'),scale=Math.min(1,320/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
