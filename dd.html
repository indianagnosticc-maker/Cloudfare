<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text <-> Siren Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #dfe1e5;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            resize: none;
            font-family: Arial, sans-serif;
        }
        textarea:focus { border-color: #1a73e8; }
        .file-input {
            margin: 15px 0;
            font-size: 14px;
            padding: 10px;
            background: #f1f3f4;
            border-radius: 8px;
        }
        button {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #1557b0; }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #d93025;
            word-wrap: break-word;
        }
        .success { color: #188038 !important; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f1f3f4;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            word-break: break-all;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <textarea id="mainInput" placeholder="Type text here to convert into Siren..."></textarea>
    
    <div class="file-input">
        <p>OR upload a Siren (.wav) file to decode:</p>
        <!-- Yahan 'accept' hata diya hai taaki koi bhi file select ho sake -->
        <input type="file" id="fileInput">
    </div>

    <button onclick="process()">Convert</button>

    <div id="status"></div>
    <div id="resultBox" class="result-box"></div>
</div>

<script>
    const SAMPLE_RATE = 44100;
    const FREQ_ZERO = 1000;
    const FREQ_ONE = 2000;
    const BIT_DURATION = 0.015;
    const SECRET_KEY = [67, 79, 68, 69]; // "CODE"

    function process() {
        const text = document.getElementById('mainInput').value.trim();
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');

        status.textContent = "";
        status.className = "";
        resultBox.style.display = "none";
        resultBox.textContent = "";

        if (fileInput.files.length > 0) {
            status.textContent = "Decoding...";
            decodeAudio(fileInput.files[0], status, resultBox);
        } else if (text) {
            status.textContent = "Generating Siren...";
            encodeText(text, status);
        } else {
            status.textContent = "Please enter text or select a file.";
        }
    }

    function encodeText(text, status) {
        try {
            const encoder = new TextEncoder();
            const textBytes = Array.from(encoder.encode(text));
            const payload = SECRET_KEY.concat(textBytes);
            
            let bits = [];
            payload.forEach(byte => {
                for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
            });

            const samplesPerBit = Math.floor(SAMPLE_RATE * BIT_DURATION);
            const totalSamples = bits.length * samplesPerBit + SAMPLE_RATE;
            const buffer = new Float32Array(totalSamples);

            let offset = 0;
            bits.forEach(bit => {
                const freq = bit === 1 ? FREQ_ONE : FREQ_ZERO;
                for (let i = 0; i < samplesPerBit; i++) {
                    buffer[offset++] = Math.sin(2 * Math.PI * freq * (i / SAMPLE_RATE));
                }
            });

            const wavBuffer = new ArrayBuffer(44 + buffer.length * 2);
            const view = new DataView(wavBuffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + buffer.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, SAMPLE_RATE, true);
            view.setUint32(28, SAMPLE_RATE * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, buffer.length * 2, true);

            let writeOffset = 44;
            for (let i = 0; i < buffer.length; i++) {
                let s = Math.max(-1, Math.min(1, buffer[i]));
                view.setInt16(writeOffset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                writeOffset += 2;
            }

            const blob = new Blob([view], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'siren.wav';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);

            status.textContent = "✅ WAV file downloaded!";
            status.className = "success";
            document.getElementById('mainInput').value = ""; 
        } catch (e) {
            status.textContent = "❌ Error generating audio.";
        }
    }

    async function decodeAudio(file, status, resultBox) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const view = new DataView(arrayBuffer);
            
            let dataOffset = 12, dataSize = 0;
            while (dataOffset < view.byteLength - 8) {
                const chunkId = String.fromCharCode(view.getUint8(dataOffset), view.getUint8(dataOffset+1), view.getUint8(dataOffset+2), view.getUint8(dataOffset+3));
                const chunkSize = view.getUint32(dataOffset + 4, true);
                if (chunkId === 'data') {
                    dataOffset += 8; dataSize = chunkSize; break;
                }
                dataOffset += 8 + chunkSize;
            }

            if (dataSize === 0) throw new Error("Invalid WAV");

            const numSamples = dataSize / 2;
            const audioData = new Float32Array(numSamples);
            for (let i = 0; i < numSamples; i++) {
                audioData[i] = view.getInt16(dataOffset + i * 2, true) / 32768;
            }

            const samplesPerBit = Math.floor(SAMPLE_RATE * BIT_DURATION);
            const numBits = Math.floor(numSamples / samplesPerBit);
            let bits = "";

            for (let b = 0; b < numBits; b++) {
                let start = b * samplesPerBit;
                let end = start + samplesPerBit;
                let zeroCrossings = 0;
                
                for (let i = start + 1; i < end; i++) {
                    if ((audioData[i-1] <= 0 && audioData[i] > 0) || (audioData[i-1] >= 0 && audioData[i] < 0)) {
                        zeroCrossings++;
                    }
                }
                
                let estFreq = (zeroCrossings / 2) / (samplesPerBit / SAMPLE_RATE);
                bits += (Math.abs(estFreq - FREQ_ONE) < Math.abs(estFreq - FREQ_ZERO)) ? "1" : "0";
            }

            let bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                let byteStr = bits.substr(i, 8);
                if (byteStr.length === 8) bytes.push(parseInt(byteStr, 2));
            }

            let isValid = true;
            for (let i = 0; i < 4; i++) {
                if (bytes[i] !== SECRET_KEY[i]) isValid = false;
            }

            if (!isValid) {
                status.textContent = "❌ Not a valid siren file!";
                return;
            }

            const textBytes = bytes.slice(4);
            const decoded = new TextDecoder().decode(new Uint8Array(textBytes));
            
            status.textContent = "✅ Decoded Text:";
            status.className = "success";
            resultBox.textContent = decoded;
            resultBox.style.display = "block";
            
            document.getElementById('fileInput').value = ""; 
        } catch (e) {
            status.textContent = "❌ Failed to decode audio. Make sure it's a valid WAV file.";
        }
    }

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }
</script>

</body>
</html>
