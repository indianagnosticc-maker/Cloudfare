<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Python OSINT Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --panel: #12151a;
    --panel-inner: #181b21;
    --line: #232830;
    --text: #d7dae0;
    --dim: #6b7280;
    --blue: #4b8bbe;
    --yellow: #ffd43b;
    --green: #7ec699;
    --red: #e06c75;
    --ease: cubic-bezier(.2, .8, .2, 1);

    /* GitHub-style code colors */
    --gh-key: #79c0ff;
    --gh-string: #a5d6ff;
    --gh-number: #79c0ff;
    --gh-bool: #ff7b72;
    --gh-null: #ff7b72;
    --gh-punct: #8b949e;
    --gh-keyword: #ff7b72;
    --gh-tag: #7ee787;
    --gh-attr: #d2a8ff;
    --gh-const: #79c0ff;
    --gh-comment: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button, input { font-family: inherit; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .term {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
  }
  .bar .name { color: var(--text); display: flex; align-items: center; gap: 8px; }
  .bar svg { width: 14px; height: 14px; }
  .bar .ver { color: var(--dim); }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .tab {
    background: none;
    border: 0;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 11px 4px;
    cursor: pointer;
    transition: color .2s var(--ease);
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); }
  .tab i { font-style: normal; color: var(--dim); margin-right: 4px; }
  .tab.on i { color: var(--yellow); }
  .ind {
    position: absolute;
    bottom: -1px;
    left: 0;
    height: 2px;
    width: 25%;
    background: var(--yellow);
    transition: transform .3s var(--ease);
  }

  .body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  .quota { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .quota b { color: var(--text); font-weight: 500; }
  .track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--blue); transition: width .35s var(--ease); }

  form {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 4px 4px 12px;
    transition: border-color .2s var(--ease);
  }
  form:focus-within { border-color: var(--blue); }
  form.err { border-color: var(--red); }
  form .prompt { color: var(--yellow); user-select: none; }
  input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    padding: 8px 0;
    caret-color: var(--yellow);
  }
  input::placeholder { color: #444b57; }
  .count { color: var(--dim); font-size: 11px; padding-right: 2px; }
  .count.full { color: var(--green); }
  button.run {
    background: var(--text);
    color: var(--bg);
    border: 0;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    font-size: 12px;
    padding: 8px 14px;
    cursor: pointer;
    transition: opacity .2s var(--ease), transform .1s var(--ease);
  }
  button.run:hover { opacity: .85; }
  button.run:active { transform: scale(.97); }
  button.run:disabled { opacity: .35; cursor: not-allowed; transform: none; }

  .log {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    height: 150px;
    overflow-y: auto;
    font-size: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .log div { animation: in .2s var(--ease); white-space: pre-wrap; word-break: break-all; }
  @keyframes in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .l-dim { color: var(--dim); }
  .l-cmd { color: var(--text); }
  .l-cmd::before { content: '>>> '; color: var(--yellow); }
  .l-ok { color: var(--green); }
  .l-err { color: var(--red); }
  .l-warn { color: var(--yellow); }

  /* ============ GitHub-style JSON coloring ============ */
  .json { font-family: 'Roboto Mono', monospace; font-size: 11.5px; line-height: 1.55; }
  .json .k { color: var(--gh-key); }       /* keys → blue */
  .json .s { color: var(--gh-string); }    /* strings → light blue */
  .json .n { color: var(--gh-number); }    /* numbers → blue */
  .json .b { color: var(--gh-bool); }      /* true/false → red */
  .json .nl { color: var(--gh-null); }     /* null → red */
  .json .p { color: var(--gh-punct); }     /* punctuation → grey */
  .json .url { color: var(--gh-tag); }     /* urls → green */
  .json .email { color: var(--gh-attr); }  /* emails → purple */
  .json .key-important { color: var(--gh-keyword); font-weight: 600; }

  /* ============ Smart formatted view ============ */
  .formatted-view {
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .formatted-view .fv-row {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 8px;
    align-items: start;
  }
  .formatted-view .fv-key {
    color: var(--gh-key);
    font-weight: 500;
  }
  .formatted-view .fv-val {
    color: var(--gh-string);
    word-break: break-word;
  }
  .formatted-view .fv-val.num { color: var(--gh-number); }
  .formatted-view .fv-val.bool { color: var(--gh-bool); }
  .formatted-view .fv-val.nul { color: var(--gh-null); }
  .formatted-view .fv-val.url { color: var(--gh-tag); }
  .formatted-view .fv-val.email { color: var(--gh-attr); }
  .formatted-view .fv-sub {
    color: var(--gh-punct);
    padding-left: 2px;
  }
  .formatted-view .fv-line {
    color: var(--gh-punct);
    padding-left: 4px;
  }
  .formatted-view .fv-empty {
    color: var(--dim);
    font-style: italic;
  }

  /* View full button */
  .view-full {
    display: none;
    width: 100%;
    margin-top: 2px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease);
  }
  .view-full:hover { border-color: var(--blue); }
  .view-full.show { display: block; }
  .view-full:active { transform: scale(.98); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--dim);
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .row .mod { color: var(--text); }
  .sw {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle {
    width: 30px;
    height: 16px;
    border-radius: 8px;
    background: var(--line);
    border: 0;
    position: relative;
    cursor: pointer;
    transition: background .25s var(--ease);
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--dim);
    transition: transform .25s var(--ease), background .25s var(--ease);
  }
  .toggle.on { background: var(--blue); }
  .toggle.on::after { transform: translateX(14px); background: #fff; }

  .foot {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--dim);
  }
  .foot .ready::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    vertical-align: 1px;
  }
  .foot .busy::before { background: var(--yellow); }

  .sms-options { display: none; grid-template-columns: 110px 110px; gap: 8px; margin-top: 10px; }
  .sms-options.show { display: grid; }
  .mini-field { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .mini-field label { display: block; color: var(--dim); font-size: 9px; margin-bottom: 2px; }
  .mini-field input { width: 100%; box-sizing: border-box; padding: 2px 0; font-size: 11px; }

  /* ============ FULLSCREEN OVERLAY ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    display: none;
    flex-direction: column;
    animation: fadeIn .25s var(--ease);
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .overlay-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
  }
  .back-btn {
    background: none;
    border: 0;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    transition: background .2s var(--ease);
  }
  .back-btn:hover { background: var(--line); }
  .back-btn:active { transform: scale(.95); }
  .back-btn svg { width: 18px; height: 18px; }
  .overlay-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    font-family: 'Roboto Mono', monospace;
  }
  .overlay-badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--dim);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'Roboto Mono', monospace;
  }

  .overlay-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .overlay-content pre {
    white-space: pre-wrap;
    word-break: break-all;
    font-family: inherit;
  }
  .overlay-content .formatted-view {
    font-size: 13px;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all .3s var(--ease);
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="term">
  <div class="bar">
    <div class="name">
      <svg viewBox="0 0 128 128"><path fill="#4b8bbe" d="M63.7 1.5c-15.8 0-25.2 6.8-25.2 19.9v14.7h25.6v3.7H25.3C11.5 39.8 0 50.1 0 63.8c0 14 11.7 24.1 25.3 24.1h7.8V75.6c0-11 9.4-20.2 20.7-20.2h25.4c9.3 0 16.9-7.4 16.9-16.7V17.8c0-10.7-10.2-16.3-32.4-16.3zM49.2 11.2c3 0 5.4 2.4 5.4 5.5 0 3-2.4 5.4-5.4 5.4-3 0-5.5-2.4-5.5-5.4 0-3.1 2.5-5.5 5.5-5.5z"/><path fill="#ffd43b" d="M64.3 126.5c15.8 0 25.2-6.8 25.2-19.9V91.9H63.9v-3.7h38.8c13.8 0 25.3-10.3 25.3-24 0-14-11.7-24.1-25.3-24.1h-7.8v12.3c0 11-9.4 20.2-20.7 20.2H48.8c-9.3 0-16.9 7.4-16.9 16.7v20.9c0 10.7 10.2 16.3 32.4 16.3zm14.5-9.7c-3 0-5.4-2.4-5.4-5.5 0-3 2.4-5.4 5.4-5.4 3 0 5.5 2.4 5.5 5.4 0 3.1-2.5 5.5-5.5 5.5z"/></svg>
      terminal.py
    </div>
    <span class="ver">python 3.12</span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-mod="osint"><i>1</i>osint</button>
    <button class="tab" data-mod="v_osint"><i>2</i>v_osint</button>
    <button class="tab" data-mod="t_osint"><i>3</i>t_osint</button>
    <button class="tab" data-mod="sms_b"><i>4</i>sms_b</button>
    <div class="ind" id="ind"></div>
  </div>

  <div class="body">
    <div>
      <div class="quota">
        <span>quota <b id="q-text">0/10</b></span>
        <span id="q-pct">0%</span>
      </div>
      <div class="track"><div class="fill" id="q-fill"></div></div>
    </div>

    <form id="form" autocomplete="off">
      <span class="prompt">&gt;&gt;&gt;</span>
      <input id="inp" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit target">
      <span class="count" id="count">0/10</span>
      <button class="run" id="run" type="submit">run</button>
    </form>

    <div class="log" id="log">
      <div class="l-dim"># python 3.12 · session started</div>
      <div class="l-dim"># module: osint</div>
    </div>

    <button class="view-full" id="viewFull">⤢ view full data</button>

    <div class="sms-options" id="smsOptions">
      <div class="mini-field">
        <label for="quantity">quantity</label>
        <input id="quantity" type="number" min="1" value="1">
      </div>
      <div class="mini-field">
        <label for="timeSet">time set</label>
        <input id="timeSet" type="number" min="1" value="1">
      </div>
    </div>

    <div class="row">
      <span>module: <span class="mod" id="mod">osint</span></span>
      <span class="sw">auto-sync <button class="toggle" id="sync" type="button" role="switch" aria-checked="false"></button></span>
    </div>
  </div>

  <div class="foot">
    <span class="ready" id="status">ready</span>
    <span id="ratio">1/4 · tls 1.3</span>
  </div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-bar">
    <button class="back-btn" id="backBtn" aria-label="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <span class="overlay-title" id="overlayTitle">data.json</span>
    <span class="overlay-badge" id="overlayBadge">200 OK</span>
  </div>
  <div class="overlay-content" id="overlayContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const tabs = [...document.querySelectorAll('.tab')];
  const ind = $('ind'), inp = $('inp'), form = $('form'), run = $('run');
  const log = $('log'), count = $('count'), status = $('status');
  const viewFull = $('viewFull');
  const overlay = $('overlay');
  const overlayContent = $('overlayContent');
  const overlayTitle = $('overlayTitle');
  const overlayBadge = $('overlayBadge');

  const MAX = 10, COOLDOWN = 5 * 60 * 1000;
  let mod = 'osint', used = 0, busy = false, cooldownEnd = 0, timer = null;
  let lastResponse = null;
  let autoSyncOn = false;

  /* ─────────── HELPERS ─────────── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function looksLikeUrl(s) {
    return /^https?:\/\//i.test(String(s));
  }
  function looksLikeEmail(s) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s));
  }
  function looksLikePhone(s) {
    return /^\+?\d{7,15}$/.test(String(s).replace(/[\s\-()]/g, ''));
  }

  /* ─────────── JSON MULTI-COLOR HIGHLIGHTER ─────────── */
  function highlightJson(json) {
    let text = typeof json === 'string' ? json : JSON.stringify(json, null, 2);
    if (!text) return '';
    text = escapeHtml(text);

    return text.replace(
      /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?|[{}\[\],:])/g,
      (match) => {
        // String (key or value)
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            // It's a key
            const keyName = match.replace(/:\s*$/, '').replace(/"/g, '').toLowerCase();
            const importantKeys = ['password', 'pass', 'token', 'key', 'secret', 'auth', 'credit', 'cvv', 'aadhaar', 'pan'];
            const cls = importantKeys.some(k => keyName.includes(k)) ? 'key-important' : 'k';
            return `<span class="${cls}">${match}</span>`;
          } else {
            // String value — detect content type
            const raw = match.slice(1, -1);
            let cls = 's';
            if (looksLikeUrl(raw)) cls = 'url';
            else if (looksLikeEmail(raw)) cls = 'email';
            return `<span class="${cls}">${match}</span>`;
          }
        }
        // Booleans
        if (/true|false/.test(match)) return `<span class="b">${match}</span>`;
        // Null
        if (/null/.test(match)) return `<span class="nl">${match}</span>`;
        // Punctuation
        if (/[{}\[\],:]/.test(match)) return `<span class="p">${match}</span>`;
        // Numbers
        return `<span class="n">${match}</span>`;
      }
    );
  }

  /* ─────────── SMART FORMATTED VIEW ─────────── */
  /* Takes a JSON object and produces clean key-value lines with no extra gaps */
  function formatSmart(obj, indentLevel = 0) {
    const lines = [];
    const indent = '  '.repeat(indentLevel);

    if (obj === null || obj === undefined) {
      return `<span class="fv-empty">${indent}—</span>`;
    }

    if (Array.isArray(obj)) {
      if (obj.length === 0) return `<span class="fv-empty">${indent}[] (empty)</span>`;
      obj.forEach((item, i) => {
        if (typeof item === 'object' && item !== null) {
          lines.push(formatSmart(item, indentLevel));
        } else {
          lines.push(`${indent}<span class="fv-line">${escapeHtml(formatValue(item))}</span>`);
        }
      });
      return lines.join('\n');
    }

    if (typeof obj === 'object') {
      const keys = Object.keys(obj);
      if (keys.length === 0) return `<span class="fv-empty">${indent}{} (empty)</span>`;

      keys.forEach(k => {
        const v = obj[k];
        const keyHtml = `<span class="fv-key">${escapeHtml(k)}</span>`;

        if (v === null || v === undefined) {
          lines.push(`${indent}<span class="fv-row">${keyHtml}<span class="fv-val nul">null</span></span>`);
        } else if (Array.isArray(v)) {
          if (v.length === 0) {
            lines.push(`${indent}<span class="fv-row">${keyHtml}<span class="fv-empty">[]</span></span>`);
          } else if (v.every(x => typeof x !== 'object' || x === null)) {
            // Simple array — show all on same row separated by comma
            const vals = v.map(x => `<span class="fv-val ${classForValue(x)}">${escapeHtml(formatValue(x))}</span>`).join('<span class="fv-sub">, </span>');
            lines.push(`${indent}<span class="fv-row">${keyHtml}<span>${vals}</span></span>`);
          } else {
            // Array of objects — one row per item
            lines.push(`${indent}<span class="fv-row">${keyHtml}<span class="fv-sub">[${v.length}]</span></span>`);
            v.forEach((item, i) => {
              const inner = formatSmart(item, indentLevel + 1);
              lines.push(`${indent}<span class="fv-sub">  ${i + 1}.</span>`);
              lines.push(inner);
            });
          }
        } else if (typeof v === 'object') {
          lines.push(`${indent}<span class="fv-row">${keyHtml}<span class="fv-sub">{...}</span></span>`);
          lines.push(formatSmart(v, indentLevel + 1));
        } else {
          lines.push(`${indent}<span class="fv-row">${keyHtml}<span class="fv-val ${classForValue(v)}">${escapeHtml(formatValue(v))}</span></span>`);
        }
      });
      return lines.join('\n');
    }

    return `${indent}${escapeHtml(formatValue(obj))}`;
  }

  function formatValue(v) {
    if (v === null || v === undefined) return 'null';
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    return String(v);
  }

  function classForValue(v) {
    if (v === null || v === undefined) return 'nul';
    if (typeof v === 'boolean') return 'bool';
    if (typeof v === 'number') return 'num';
    if (looksLikeUrl(v)) return 'url';
    if (looksLikeEmail(v)) return 'email';
    return 'str';
  }

  /* ─────────── PRINT ─────────── */
  function print(text, cls) {
    const d = document.createElement('div');
    d.className = cls || '';
    d.textContent = text;
    log.appendChild(d);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  function printJson(data) {
    const d = document.createElement('div');
    if (autoSyncOn) {
      d.className = 'formatted-view';
      d.innerHTML = formatSmart(data, 0);
    } else {
      d.className = 'json';
      d.innerHTML = highlightJson(data);
    }
    log.appendChild(d);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  /* ─────────── QUOTA / STATUS ─────────── */
  function setQuota() {
    const pct = used * 10;
    $('q-text').textContent = used + '/' + MAX;
    $('q-pct').textContent = pct + '%';
    $('q-fill').style.width = pct + '%';
  }

  function setStatus(text, busyDot) {
    status.textContent = text;
    status.classList.toggle('busy', !!busyDot);
  }

  /* ─────────── TABS ─────────── */
  tabs.forEach((t, i) => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    ind.style.transform = 'translateX(' + (i * 100) + '%)';
    mod = t.dataset.mod;
    $('mod').textContent = mod;
    $('ratio').textContent = (i + 1) + '/4 · tls 1.3';
    if (mod === 'v_osint') {
      inp.inputMode = 'text';
      inp.maxLength = 12;
      inp.placeholder = 'currently under development';
      inp.disabled = true;
      run.disabled = true;
      print('# V-OSINT is currently under development.', 'l-warn');
    } else if (mod === 't_osint') {
      inp.inputMode = 'text';
      inp.maxLength = 32;
      inp.placeholder = 'telegram username / user id';
      inp.disabled = false;
      run.disabled = false;
    } else if (mod === 'sms_b') {
      inp.inputMode = 'numeric';
      inp.maxLength = 10;
      inp.placeholder = '10-digit target';
      inp.disabled = false;
      run.disabled = false;
    } else {
      inp.inputMode = 'numeric';
      inp.maxLength = 10;
      inp.placeholder = '10-digit target';
      inp.disabled = false;
      run.disabled = false;
    }
    $('smsOptions').classList.toggle('show', mod === 'sms_b');
    viewFull.classList.remove('show');
    print('# module: ' + mod, 'l-dim');
  }));

  /* ─────────── INPUT ─────────── */
  inp.addEventListener('input', () => {
    if (mod === 'osint' || mod === 'sms_b') {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 10);
      count.textContent = inp.value.length + '/10';
      count.classList.toggle('full', inp.value.length === 10);
    } else if (mod === 'v_osint') {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9 -]/g, '').slice(0, 12);
      count.textContent = inp.value.length + '/12';
      count.classList.toggle('full', inp.value.length > 0);
    } else {
      inp.value = inp.value.replace(/\s+/g, '').slice(0, 32);
      count.textContent = inp.value.length + '/32';
      count.classList.toggle('full', inp.value.length > 0);
    }
    form.classList.remove('err');
  });

  /* ─────────── AUTO-SYNC TOGGLE ─────────── */
  $('sync').addEventListener('click', e => {
    autoSyncOn = e.currentTarget.classList.toggle('on');
    e.currentTarget.setAttribute('aria-checked', autoSyncOn);
    print('# auto_sync = ' + (autoSyncOn ? 'True' : 'False'), 'l-dim');

    // Re-render last response if exists
    if (lastResponse) {
      print('# re-rendering in ' + (autoSyncOn ? 'smart' : 'json') + ' view', 'l-dim');
      printJson(lastResponse.data);
    }
  });

  /* ─────────── COOLDOWN ─────────── */
  function tick() {
    const left = cooldownEnd - Date.now();
    if (left <= 0) {
      clearInterval(timer); timer = null; cooldownEnd = 0; used = 0;
      setQuota();
      run.disabled = false;
      setStatus('ready');
      print('# quota refreshed', 'l-ok');
      return;
    }
    const s = Math.ceil(left / 1000);
    setStatus('cooldown ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'), true);
  }

  /* ─────────── ENDPOINTS ─────────── */
  const ENDPOINTS = {
    osint: '/osint',
    t_osint: '/tgosint',
    sms_b: '/smsb'
  };

  function endpointUrl(path, q) {
    const u = new URL(path, window.location.origin);
    u.searchParams.set('q', q);
    return u.href;
  }

  async function callBackend(currentMod, value) {
    let url, options;

    if (currentMod === 'osint') {
      url = endpointUrl(ENDPOINTS.osint, value);
      options = { method: 'GET' };
    } else if (currentMod === 't_osint') {
      url = endpointUrl(ENDPOINTS.t_osint, value);
      options = { method: 'GET' };
    } else if (currentMod === 'sms_b') {
      const countVal = Number($('quantity').value);
      const delay = Number($('timeSet').value);
      url = new URL(ENDPOINTS.sms_b, window.location.origin).href;
      options = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          number: value,
          count: countVal,
          delay: delay,
          concurrency: 10,
          mode: 'both'
        })
      };
    } else {
      throw new Error('This module is not connected yet');
    }

    const response = await fetch(url, {
      ...options,
      headers: {
        'Accept': 'application/json, text/plain, */*',
        ...(options.headers || {})
      },
      cache: 'no-store',
      credentials: 'same-origin'
    });

    const text = await response.text();
    let data = text;
    try { data = JSON.parse(text); } catch (_) {}

    if (!response.ok) {
      const message = typeof data === 'object' && data !== null
        ? (data.error || data.message || JSON.stringify(data))
        : (text || ('HTTP ' + response.status));
      throw new Error('HTTP ' + response.status + ': ' + message);
    }

    return data;
  }

  /* ─────────── FULLSCREEN VIEW ─────────── */
  function openOverlay(data, title, statusText) {
    overlayTitle.textContent = title || 'response.json';
    overlayBadge.textContent = statusText || '200 OK';

    if (autoSyncOn) {
      overlayContent.innerHTML = `<div class="formatted-view">${formatSmart(data, 0)}</div>`;
    } else {
      overlayContent.innerHTML = `<pre>${highlightJson(data)}</pre>`;
    }

    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeOverlay() {
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  }

  $('backBtn').addEventListener('click', closeOverlay);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeOverlay();
  });

  viewFull.addEventListener('click', () => {
    if (!lastResponse) return;
    const title = (lastResponse.module || 'response') + '_' +
                  (lastResponse.query || 'data') + '.json';
    openOverlay(lastResponse.data, title, '200 OK');
  });

  /* ─────────── TOAST ─────────── */
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* ─────────── SUBMIT ─────────── */
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    if (cooldownEnd > Date.now()) { tick(); return; }

    const val = inp.value.trim();
    let valid = false;
    if (mod === 'osint') valid = /^\d{10}$/.test(val);
    else if (mod === 'v_osint') valid = /^[A-Z0-9 -]{2,12}$/.test(val);
    else if (mod === 't_osint') valid = val.length > 0;
    else if (mod === 'sms_b') {
      const qty = Number($('quantity').value);
      const time = Number($('timeSet').value);
      valid = /^\d{10}$/.test(val) && Number.isFinite(qty) && qty > 0 && Number.isFinite(time) && time >= 0;
    }

    if (!valid) {
      form.classList.add('err');
      const msg = mod === 'osint' ? 'ValueError: 10-digit target required' :
                  mod === 'v_osint' ? 'ValueError: vehicle number required' :
                  mod === 't_osint' ? 'ValueError: username / user id required' :
                  'ValueError: 10-digit target, quantity and time set required';
      print(msg, 'l-err');
      return;
    }

    busy = true;
    run.disabled = true;
    viewFull.classList.remove('show');
    setStatus('running', true);
    print(mod + '.query("' + val + '")', 'l-cmd');

    try {
      const data = await callBackend(mod, val);
      used++;
      setQuota();
      print('<Response [200]> OK', 'l-ok');
      printJson(data);

      lastResponse = { module: mod, query: val, data: data };
      viewFull.classList.add('show');
      showToast('Response received');
    } catch (err) {
      print('BackendError: ' + (err.message || String(err)), 'l-err');
    } finally {
      inp.value = '';
      count.textContent = '0/' + (mod === 'osint' || mod === 'sms_b' ? '10' : mod === 'v_osint' ? '12' : '32');
      count.classList.remove('full');
      busy = false;

      if (used >= MAX) {
        cooldownEnd = Date.now() + COOLDOWN;
        print('RateLimitError: quota exhausted', 'l-warn');
        tick();
        timer = setInterval(tick, 1000);
      } else {
        run.disabled = false;
        setStatus('ready');
      }
    }
  });
</script>
</body>
