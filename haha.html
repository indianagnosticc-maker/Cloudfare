<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Little Creature</title>
<style>
:root{color-scheme:dark;--black:#000;--white:#f8f8f6;--ink:#090909}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;background:#000;touch-action:pan-x pan-y;user-select:none}
#stage{position:absolute;inset:0;display:grid;place-items:center;background:#000;overflow:hidden;touch-action:none}
#creature{position:relative;width:min(78vw,390px);height:min(47vw,235px);min-width:250px;min-height:150px;transform:translate3d(0,0,0);will-change:transform}
.eyes{position:absolute;top:5%;left:0;width:100%;height:73%;display:flex;justify-content:center;align-items:center;gap:clamp(18px,6vw,34px)}
.eye{position:relative;width:34%;height:100%;max-width:132px;border-radius:48% 48% 46% 46%;background:var(--white);overflow:hidden;transform-origin:50% 55%;will-change:transform}
.eye::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 -3px 0 rgba(0,0,0,.025);pointer-events:none}
.brow{position:absolute;top:-1%;width:28%;height:7px;max-height:4%;min-height:3px;border-radius:100px;background:#151515;transform-origin:center;z-index:2;will-change:transform}
.brow.left{left:15%;transform:rotate(-4deg)}
.brow.right{right:15%;transform:rotate(4deg)}
.pupil{position:absolute;left:50%;top:51%;width:39%;height:43%;border-radius:50%;background:#080808;transform:translate(-50%,-50%);will-change:transform,width,height}
.highlight{position:absolute;width:23%;height:23%;border-radius:50%;background:#fff;top:15%;left:18%}
.highlight.small{width:9%;height:9%;top:42%;left:70%;opacity:.85}
.lid{position:absolute;inset:0 0 auto;height:0%;background:#000;border-radius:0 0 48% 48%;z-index:3;will-change:height}
.mouth{position:absolute;left:50%;top:86%;width:13%;height:8%;min-height:7px;transform:translateX(-50%);border-radius:0 0 50% 50%;border-bottom:4px solid #f4f4f1;will-change:transform,width,height,border-radius,border-bottom,top;transform-origin:center}
#creature.happy .mouth{width:27%;height:13%;top:81%;border:0;border-bottom:5px solid #f8f8f6;border-radius:0 0 50% 50%}
#creature.happy .eye{transform:scaleY(.91)}
#creature.curious .mouth{width:11%;height:14%;top:84%;border:3px solid #f8f8f6;border-radius:50%}
#creature.surprised .mouth{width:14%;height:21%;top:81%;border:3px solid #f8f8f6;border-radius:50%}
#creature.sad .mouth{width:22%;height:10%;top:89%;border:0;border-top:4px solid #f8f8f6;border-radius:50% 50% 0 0}
#creature.sleepy .mouth{width:10%;height:4%;top:88%;border-bottom-width:3px}
#creature.doubtful .mouth{width:20%;height:4%;top:88%;border-bottom-width:3px;transform:translateX(-50%) rotate(-8deg)}
#creature.confused .mouth{width:17%;height:7%;top:86%;border-bottom-width:4px;transform:translateX(-50%) rotate(12deg)}
#creature.thinking .mouth{width:12%;height:5%;top:87%;border-bottom-width:3px;transform:translateX(-50%) rotate(-7deg)}
#creature.neutral .mouth{width:12%;height:5%;top:87%;border-bottom-width:3px}
#creature.sleepy .lid{height:48%}
#creature.sad .brow.left{transform:rotate(13deg) translateY(2px)}
#creature.sad .brow.right{transform:rotate(-13deg) translateY(2px)}
#creature.doubtful .brow.left{transform:rotate(-13deg) translateY(-3px)}
#creature.doubtful .brow.right{transform:rotate(14deg) translateY(3px)}
#creature.confused .brow.left{transform:rotate(-14deg) translateY(-3px)}
#creature.confused .brow.right{transform:rotate(-2deg) translateY(2px)}
#creature.curious .brow{transform:translateY(-4px)}
#creature.surprised .brow{transform:translateY(-7px) scaleX(1.04)}
#creature.thinking .brow.left{transform:rotate(-6deg) translateY(-2px)}
#creature.thinking .brow.right{transform:rotate(8deg)}
#creature.sleepy .brow{transform:translateY(3px) scaleX(.9)}
#creature.blink .lid{height:100%;transition:height .085s ease-in}
#creature:not(.blink) .lid{transition:height .13s ease-out}
#creature.blink .eye{transform:scaleY(.98)}
#creature.surprised .eye{transform:scale(1.04,1.08)}
#creature.curious .eye{transform:scale(1.02,1.04)}
#creature.sleepy .eye{transform:scaleY(.94)}
#creature .eye{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#creature.idle{animation:bob 4.7s ease-in-out infinite}
#creature.tense .brow{transform:translateY(3px) scaleX(1.06)!important}
#creature.tense .eye{transform:scaleY(.94)!important}
#creature.angry .brow.left{transform:rotate(18deg) translateY(5px)!important}
#creature.angry .brow.right{transform:rotate(-18deg) translateY(5px)!important}
#creature.angry .eye{transform:scaleY(.9)!important}
#creature.dizzy{animation:dizzyWobble .32s ease-in-out infinite alternate}
#creature.dizzy .eye{transform:rotate(-8deg) scale(.94)!important}
#creature.dizzy .pupil{width:28%;height:30%}
@keyframes dizzyWobble{from{margin-left:-12px;rotate:-5deg}to{margin-left:12px;rotate:5deg}}
#creature.startled{animation:startle .24s ease-out 2}
@keyframes startle{0%,100%{translate:0 0}45%{translate:0 -12px}}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}
#status{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);font:12px/1.4 system-ui,sans-serif;color:#aaa;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;text-align:center}
#status.show{opacity:.85}
#settings{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,12px);display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#settings.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.control{appearance:none;border:0;background:#171717;color:#eee;border-radius:999px;padding:11px 15px;font:12px system-ui,sans-serif;white-space:nowrap}
.control:active{background:#262626}
#cam{display:none}
#camera{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media(min-width:700px){#creature{width:330px;height:200px}.eye{max-width:125px}.control{font-size:13px}}
@media(prefers-reduced-motion:reduce){#creature.idle{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="stage" aria-label="Interactive virtual character">
  <div id="creature" class="neutral idle" aria-label="Little digital creature">
    <div class="eyes">
      <div class="eye" id="eyeL"><div class="pupil" id="pupilL"><i class="highlight"></i><i class="highlight small"></i></div><div class="lid"></div></div>
      <div class="eye" id="eyeR"><div class="pupil" id="pupilR"><i class="highlight"></i><i class="highlight small"></i></div><div class="lid"></div></div>
    </div>
    <div class="brow left" id="browL"></div><div class="brow right" id="browR"></div>
    <div class="mouth" id="mouth"></div>
  </div>
  <div id="status" role="status"></div>
  <video id="camera" playsinline muted></video>
  <nav id="settings" aria-label="Creature settings">
    <button class="control" id="soundBtn" type="button">Sound: off</button>
    <button class="control" id="camBtn" type="button">Enable hand tracking</button>
    <button class="control" id="closeBtn" type="button" aria-label="Close settings">Done</button>
  </nav>
</main>
<script>
(() => {
  const stage=document.getElementById('stage'), creature=document.getElementById('creature');
  const pupilL=document.getElementById('pupilL'), pupilR=document.getElementById('pupilR');
  const eyeL=document.getElementById('eyeL'), eyeR=document.getElementById('eyeR');
  const status=document.getElementById('status'), settings=document.getElementById('settings');
  const soundBtn=document.getElementById('soundBtn'), camBtn=document.getElementById('camBtn');
  const video=document.getElementById('camera');
  const expressions=['happy','curious','doubtful','surprised','sad','sleepy','confused','thinking','neutral'];
  let soundOn=false, audioCtx=null, tracking=false, landmarker=null, stream=null, raf=0;
  let targetX=0,targetY=0,lookX=0,lookY=0,pressTimer=null,lastTap=0,expressionTimer=0,blinkTimer=0,lastGesture='',lastSound=0;
  let tapTimes=[],tiltActive=false,shakeTimes=[],lastMotionAt=0,motionPermission=false,baseBeta=null,baseGamma=null;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function sayStatus(message, duration=2400){status.textContent=message;status.classList.add('show');clearTimeout(sayStatus.t);sayStatus.t=setTimeout(()=>status.classList.remove('show'),duration)}
  function setExpression(name, sound=false){
    creature.classList.remove(...expressions,'blink');creature.classList.add(name);
    if(sound && soundOn) playSound(name);
    clearTimeout(expressionTimer);
    expressionTimer=setTimeout(()=>{if(!settings.classList.contains('open'))setExpression(expressions[Math.floor(Math.random()*expressions.length)]);},6500+Math.random()*7500);
  }
  function blink(){
    if(document.hidden)return;
    creature.classList.add('blink');
    setTimeout(()=>creature.classList.remove('blink'),105+Math.random()*55);
    blinkTimer=setTimeout(blink,2200+Math.random()*4300);
  }
  function moveEyes(x,y){
    targetX=clamp(x,-1,1);targetY=clamp(y,-1,1);
  }
  function pointerMove(e){
    const r=stage.getBoundingClientRect();
    moveEyes(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2);
  }
  function animate(){
    lookX+=(targetX-lookX)*.085;lookY+=(targetY-lookY)*.085;
    const px=lookX*22,py=lookY*20;
    for(const p of [pupilL,pupilR])p.style.transform=`translate(calc(-50% + ${px}px),calc(-50% + ${py}px))`;
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
  function ensureAudio(){
    if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
    if(audioCtx?.state==='suspended')audioCtx.resume();
  }
  function tone(freq,start,dur,type='sine',gain=.035){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+start);
    g.gain.setValueAtTime(.0001,audioCtx.currentTime+start);
    g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+start+.025);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+start+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+dur+.03);
  }
  function playSound(mood){
    const now=Date.now();if(now-lastSound<1200)return;lastSound=now;ensureAudio();if(!audioCtx)return;
    const patterns={
      happy:[[620,0,.09],[820,.09,.12]],curious:[[510,0,.12],[670,.12,.16]],
      doubtful:[[360,0,.12],[315,.12,.14]],surprised:[[740,0,.08],[930,.08,.12]],
      sad:[[390,0,.18],[330,.12,.2]],sleepy:[[300,0,.22]],confused:[[480,0,.1],[410,.1,.12],[450,.2,.09]],
      thinking:[[430,0,.11],[500,.13,.12]],neutral:[[470,0,.08]]
    };
    (patterns[mood]||patterns.neutral).forEach(([f,s,d])=>tone(f,s,d,'sine',.025));
  }
  function reaction(){
    const now=Date.now();
    tapTimes=tapTimes.filter(t=>now-t<2200);tapTimes.push(now);
    if(tapTimes.length>=5){
      setExpression('angry',true);creature.classList.add('angry');
      sayStatus('Okay okay… I’m annoyed!',1300);
      clearTimeout(reaction.angerTimer);
      reaction.angerTimer=setTimeout(()=>{creature.classList.remove('angry');setExpression('doubtful')},2600);
      return;
    }
    if(tapTimes.length>=3){
      setExpression('doubtful',true);
      sayStatus('Hey! Stop poking me…',1000);
      return;
    }
    const choices=expressions.filter(x=>x!==creature.classList[1]);
    const mood=choices[Math.floor(Math.random()*choices.length)];
    setExpression(mood,true);
    if(mood==='happy'){targetY=-.15;} else if(mood==='thinking'){targetX=Math.random()<.5?-.8:.8;}
    setTimeout(()=>{if(!tracking){targetX=(Math.random()-.5)*.3;targetY=(Math.random()-.5)*.25}},900);
  }
  stage.addEventListener('pointermove',pointerMove,{passive:true});
  stage.addEventListener('pointerdown',e=>{
    pointerMove(e);clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{settings.classList.toggle('open');if(settings.classList.contains('open'))sayStatus('Creature settings');},600);
  });
  stage.addEventListener('pointerup',e=>{
    clearTimeout(pressTimer);
    if(settings.classList.contains('open'))return;
    reaction();
  });
  stage.addEventListener('pointercancel',()=>clearTimeout(pressTimer));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')settings.classList.remove('open');if(e.key===' '){e.preventDefault();reaction()}});
  soundBtn.addEventListener('click',()=>{
    soundOn=!soundOn;soundBtn.textContent='Sound: '+(soundOn?'on':'off');
    if(soundOn){ensureAudio();playSound('curious');sayStatus('Sound effects enabled');}
    else sayStatus('Sound effects disabled');
  });
  document.getElementById('closeBtn').addEventListener('click',()=>settings.classList.remove('open'));
  function handleTilt(beta,gamma){
    if(!Number.isFinite(beta)||!Number.isFinite(gamma))return;
    if(baseBeta===null){baseBeta=beta;baseGamma=gamma;return}
    const db=beta-baseBeta,dg=gamma-baseGamma;
    // Screen tilt makes the creature lean and look toward the lower side.
    const tiltX=clamp(dg/32,-1,1),tiltY=clamp(db/35,-1,1);
    creature.style.rotate=`${clamp(dg*.22,-9,9)}deg`;
    moveEyes(tiltX,tiltY);
    if(Math.abs(db)>13||Math.abs(dg)>15){
      if(!tiltActive){
        tiltActive=true;creature.classList.add('tense');
        setExpression('doubtful',true);
        sayStatus('Whoa… careful with me!',1000);
      }
      clearTimeout(handleTilt.releaseTimer);
      handleTilt.releaseTimer=setTimeout(()=>{
        tiltActive=false;creature.classList.remove('tense');creature.style.rotate='';
        baseBeta=null;baseGamma=null;
      },900);
    }
  }
  let previousAccel=null,previousGravity=null;
  function handleMotion(e){
    const a=e.acceleration;
    const g=e.accelerationIncludingGravity;
    const now=Date.now();
    let strength=0;
    // Prefer acceleration without gravity; use changes in gravity-inclusive data as fallback.
    if(a && [a.x,a.y,a.z].some(v=>Number.isFinite(v))){
      strength=Math.hypot(a.x||0,a.y||0,a.z||0);
    }
    if(g && [g.x,g.y,g.z].some(v=>Number.isFinite(v))){
      const cur={x:g.x||0,y:g.y||0,z:g.z||0};
      if(previousGravity){
        const delta=Math.hypot(cur.x-previousGravity.x,cur.y-previousGravity.y,cur.z-previousGravity.z);
        strength=Math.max(strength,delta);
      }
      previousGravity=cur;
    }
    if(!Number.isFinite(strength))return;
    // Hardware motion sensor only: this is independent of pointer/finger movement.
    if(strength>11.5 && now-lastMotionAt>380){
      lastMotionAt=now;
      shakeTimes=shakeTimes.filter(t=>now-t<1700);shakeTimes.push(now);
      if(shakeTimes.length>=2){
        creature.classList.remove('tense','startled');creature.classList.add('dizzy');
        setExpression('confused',true);sayStatus('Whoa… I’m dizzy!',1700);
        targetX=(Math.random()-.5)*1.8;targetY=(Math.random()-.5)*1.2;
        clearTimeout(handleMotion.dizzyTimer);
        handleMotion.dizzyTimer=setTimeout(()=>{
          creature.classList.remove('dizzy');creature.style.rotate='';
          targetX=0;targetY=0;setExpression('sleepy');
        },3200);
        shakeTimes=[];
      }else{
        creature.classList.add('startled');setExpression('surprised',true);
        sayStatus('Whoa! What was that?',900);
        setTimeout(()=>creature.classList.remove('startled'),600);
      }
    }
  }
  async function enableMotionSensors(){
    try{
      // iOS requires a user gesture to request motion/orientation permissions.
      const requests=[];
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')
        requests.push(DeviceOrientationEvent.requestPermission());
      if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')
        requests.push(DeviceMotionEvent.requestPermission());
      if(requests.length){
        const results=await Promise.all(requests);
        if(results.some(v=>v!=='granted')){sayStatus('Motion permission not granted');return false}
      }
      window.addEventListener('deviceorientation',e=>handleTilt(e.beta,e.gamma),{passive:true});
      window.addEventListener('devicemotion',handleMotion,{passive:true});
      sayStatus('Move or shake your phone to make me react',2400);
      motionPermission=true;
      sayStatus('Tilt and shake reactions enabled',1800);
      return true;
    }catch(e){sayStatus('Motion sensors are unavailable here',2200);return false}
  }
  // Try enabling sensors after the first real touch, when browser permissions allow it.
  let motionSetupStarted=false;
  stage.addEventListener('pointerdown',()=>{
    if(!motionSetupStarted){motionSetupStarted=true;enableMotionSensors()}
  },{once:true,passive:true});

  async function enableTracking(){
    if(tracking){disableTracking();return}
    if(!navigator.mediaDevices?.getUserMedia){sayStatus('Camera is unavailable in this browser');return}
    camBtn.textContent='Starting camera…';
    try{
      sayStatus('Requesting camera permission…',4000);
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}},audio:false});
      video.srcObject=stream;await video.play();
      sayStatus('Loading hand tracking…',5000);
      const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
      const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      landmarker=await vision.HandLandmarker.createFromOptions(files,{
        baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},
        runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5
      });
      tracking=true;camBtn.textContent='Stop hand tracking';sayStatus('Hand tracking active',2200);
      lastGesture='';trackFrame();
    }catch(err){
      console.error(err);disableTracking();
      let msg='Could not start hand tracking';
      if(err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError')msg='Camera permission denied — allow camera access in browser settings';
      else if(location.protocol!=='https:'&&location.hostname!=='localhost')msg='Camera needs HTTPS. Open this page on a secure website.';
      sayStatus(msg,4500);
    }
  }
  function trackFrame(){
    if(!tracking||!landmarker)return;
    if(video.readyState>=2){
      try{
        const result=landmarker.detectForVideo(video,performance.now());
        if(result.landmarks?.length){
          const pts=result.landmarks[0];
          // Wrist and middle-finger MCP provide a stable hand position.
          const wrist=pts[0], middle=pts[9], indexTip=pts[8], thumbTip=pts[4];
          const x=(.5-middle.x)*2, y=(.5-middle.y)*2;
          moveEyes(clamp(x*1.3,-1,1),clamp(y*1.4,-1,1));
          const raised=indexTip.y<middle.y-.06;
          const pinch=Math.hypot(indexTip.x-thumbTip.x,indexTip.y-thumbTip.y)<.045;
          let gesture=pinch?'curious':raised?'happy':(wrist.y>.72?'surprised':'');
          if(gesture&&gesture!==lastGesture){
            if(gesture==='happy')setExpression('happy',true);
            else if(gesture==='curious')setExpression('curious',true);
            else setExpression('surprised',true);
            lastGesture=gesture;
          }else if(!gesture)lastGesture='';
        }else{moveEyes(0,0);lastGesture=''}
      }catch(e){console.warn('Hand tracking frame failed',e)}
    }
    raf=requestAnimationFrame(trackFrame);
  }
  function disableTracking(){
    tracking=false;cancelAnimationFrame(raf);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    video.srcObject=null;
    if(landmarker){try{landmarker.close()}catch{}landmarker=null}
    camBtn.textContent='Enable hand tracking';
    moveEyes(0,0);
  }
  camBtn.addEventListener('click',enableTracking);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(blinkTimer)}else blink()});
  setExpression('neutral');
  blink();
  // Randomized, low-frequency idle glances and mood changes keep the face alive.
  function idleBeat(){
    if(!settings.classList.contains('open')&&!tracking){
      const roll=Math.random();
      if(roll<.42){targetX=(Math.random()-.5)*1.15;targetY=(Math.random()-.5)*.7}
      if(roll>.72)setExpression(expressions[Math.floor(Math.random()*expressions.length)]);
      setTimeout(()=>{if(!tracking){targetX=(Math.random()-.5)*.25;targetY=(Math.random()-.5)*.2}},700+Math.random()*800);
    }
    setTimeout(idleBeat,2800+Math.random()*4700);
  }
  setTimeout(idleBeat,1700);
  window.addEventListener('pagehide',disableTracking);
})();
</script>
</body>
</html>
